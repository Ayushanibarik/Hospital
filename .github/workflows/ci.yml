name: Enterprise CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Audit & Test Workflows
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔒 Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: 🌱 Seed Initial Database Schema
        run: npm run seed

      - name: 🧪 Execute Automated Workflow Tests
        run: npm test

      - name: 🩺 Container Build Validation (Dry-Run)
        run: docker build -t hospital-automation:test .
